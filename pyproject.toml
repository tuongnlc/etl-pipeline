# Manifest để build wheel cho package `etl_pipeline` (dùng bởi artifact của bundle).
# Chạy ở gốc repo vì package nằm ở ./etl_pipeline.
[project]
name = "etl_pipeline"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    # Deps runtime của job lấy từ requirements.txt của repo. Không khai báo ở đây
    # để tránh cài những gói chỉ dùng local (apache-airflow, opencv, pytesseract...)
    # vào environment của Databricks job.
]

[project.scripts]
sample_job = "etl_pipeline.orchestration.databricks.sample_job:main"
volume_to_datalake = "etl_pipeline.orchestration.databricks.voume_to_datalake:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl_pipeline"]
