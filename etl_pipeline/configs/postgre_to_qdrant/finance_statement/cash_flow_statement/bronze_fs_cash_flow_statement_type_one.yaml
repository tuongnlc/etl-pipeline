---
kind: PostgreToQdrantBronzeConfig
spec:
  extractor:
    kind: PostgreDBExtractorWithPolarsConfig
    spec:
      uri: postgresql://postgres:postgres@localhost:5432/market_data
      source_table_name: public.fs_cash_flow_statement_type_one
      extractor_column_filter: is_load_to_qdrant
      filter_value: "1"
  transform:
    kind: QdrantTransformConfig
    spec:
      transform_steps:
        - kind: etl_pipeline.infrastructure.polars.etl.transform.columns.RenameColumns
          spec:
            column_mappings: 
              stock_id: "tên cổ phiếu"
              year: "năm"
              quarter: "quý"

              # ==================== I. DÒNG TIỀN TỪ HOẠT ĐỘNG KINH DOANH ====================
              profit_before_tax: "1. Lợi nhuận trước thuế"
              total_adjustments: "2. Điều chỉnh cho các khoản"
              depreciation_of_fixed_assets: "Khấu hao tài sản cố định"
              provisions: "Các khoản dự phòng"
              share_of_profit_from_associates: "Lợi nhuận thuần từ đầu tư vào công ty liên kết"
              write_offs_of_fixed_assets: "Xóa sổ tài sản cố định (thuần)"
              unrealized_foreign_exchange_changes: "Lãi, lỗ chênh lệch tỷ giá hối đoái chưa thực hiện"
              gain_loss_from_disposal_of_fixed_assets: "Lãi, lỗ từ thanh lý tài sản cố định"
              gain_loss_from_investing_activities: "Lãi, lỗ từ hoạt động đầu tư"
              interest_income_from_deposits: "Lãi tiền gửi"
              interest_income: "Thu nhập lãi"
              interest_expense: "Chi phí lãi vay"
              direct_appropriations_from_profit: "Các khoản chi trực tiếp từ lợi nhuận"
              operating_profit_before_working_capital_change: "3. Lợi nhuận từ hoạt động kinh doanh trước thay đổi vốn lưu động"
              change_in_receivables: "Tăng, giảm các khoản phải thu"
              change_in_inventory: "Tăng, giảm hàng tồn kho"
              change_in_payables_excl_tax_and_interest: "Tăng, giảm các khoản phải trả (Không kể lãi vay phải trả, thuế thu nhập doanh nghiệp phải nộp)"
              change_in_prepaid_expenses: "Tăng giảm chi phí trả trước"
              change_in_other_current_assets: "Tăng giảm tài sản ngắn hạn khác"
              interest_paid: "Tiền lãi vay phải trả"
              corporate_income_tax_paid: "Thuế thu nhập doanh nghiệp đã nộp"
              other_operating_cash_receipts: "Tiền thu khác từ hoạt động kinh doanh"
              other_operating_cash_payments: "Tiền chi khác từ hoạt động kinh doanh"
              net_cash_flows_from_operating_activities: "Lưu chuyển tiền thuần từ hoạt động kinh doanh"

              # ==================== II. DÒNG TIỀN TỪ HOẠT ĐỘNG ĐẦU TƯ ====================
              cash_paid_for_fixed_assets: "1. Tiền chi để mua sắm, xây dựng tài sản cố định và các tài sản dài hạn khác"
              cash_received_from_disposal_of_fixed_assets: "2. Tiền thu từ thanh lý, nhượng bán tài sản cố định và các tài sản dài hạn khác"
              cash_paid_for_loans_and_debt_instruments: "3. Tiền chi cho vay, mua các công cụ nợ của đơn vị khác"
              cash_received_from_loans_and_debt_instruments: "4. Tiền thu hồi cho vay, bán lại các công cụ nợ của các đơn vị khác"
              investments_in_joint_ventures_and_associates: "5. Đầu tư góp vốn vào công ty liên doanh liên kết"
              cash_paid_for_short_term_investments: "6. Chi đầu tư ngắn hạn"
              cash_paid_for_equity_investments: "7. Tiền chi đầu tư góp vốn vào đơn vị khác"
              cash_received_from_equity_investments: "8. Tiền thu hồi đầu tư góp vốn vào đơn vị khác"
              interest_received_from_deposits: "9. Lãi tiền gửi đã thu"
              interest_and_dividends_received: "10. Tiền thu lãi cho vay, cổ tức và lợi nhuận được chia"
              cash_paid_to_buy_back_minority_interests: "11. Tiền chi mua lại phần vốn góp của các cổ đông thiểu số"
              net_cash_flows_from_investing_activities: "Lưu chuyển tiền thuần từ hoạt động đầu tư"

              # ==================== III. DÒNG TIỀN TỪ HOẠT ĐỘNG TÀI CHÍNH ====================
              cash_received_from_issuing_shares: "1. Tiền thu từ phát hành cổ phiếu, nhận vốn góp của chủ sở hữu"
              cash_paid_for_share_buybacks: "2. Tiền chi trả vốn góp cho các chủ sở hữu, mua lại cổ phiếu của doanh nghiệp đã phát hành"
              cash_received_from_borrowings: "3. Tiền vay ngắn hạn, dài hạn nhận được"
              cash_repayments_of_borrowings: "4. Tiền chi trả nợ gốc vay"
              cash_repayments_of_finance_lease_liabilities: "5. Tiền chi trả nợ thuê tài chính"
              other_financing_cash_payments: "6. Tiền chi khác từ hoạt động tài chính"
              payments_for_privatization: "7. Tiền chi trả từ cổ phần hóa"
              dividends_paid_to_owners: "8. Cổ tức, lợi nhuận đã trả cho chủ sở hữu"
              minority_capital_contribution_into_subsidiaries: "9. Vốn góp của các cổ đông thiểu số vào các công ty con"
              payments_for_welfare_and_social_funds: "10. Chi tiêu quỹ phúc lợi xã hội"
              net_cash_flows_from_financing_activities: "Lưu chuyển tiền thuần từ hoạt động tài chính"

              # ==================== TỔNG KẾT CUỐI KỲ ====================
              net_change_in_cash: "Lưu chuyển tiền thuần trong kỳ"
              cash_and_cash_equivalents_at_start_of_period: "Tiền và tương đương tiền đầu kỳ"
              effect_of_exchange_rate_changes: "Ảnh hưởng của thay đổi tỷ giá hối đoái quy đổi ngoại tệ"
              cash_and_cash_equivalents_at_end_of_period: "Tiền và tương đương tiền cuối kỳ"
        - kind: etl_pipeline.infrastructure.polars.etl.transform.columns.ConcatColumns
          spec:
            concat_columns:
              - "tên cổ phiếu"
              - "năm"
              - "quý"
              - "1. Lợi nhuận trước thuế"
              - "2. Điều chỉnh cho các khoản"
              - "Khấu hao tài sản cố định"
              - "Các khoản dự phòng"
              - "Lợi nhuận thuần từ đầu tư vào công ty liên kết"
              - "Xóa sổ tài sản cố định (thuần)"
              - "Lãi, lỗ chênh lệch tỷ giá hối đoái chưa thực hiện"
              - "Lãi, lỗ từ thanh lý tài sản cố định"
              - "Lãi, lỗ từ hoạt động đầu tư"
              - "Lãi tiền gửi"
              - "Thu nhập lãi"
              - "Chi phí lãi vay"
              - "Các khoản chi trực tiếp từ lợi nhuận"
              - "3. Lợi nhuận từ hoạt động kinh doanh trước thay đổi vốn lưu động"
              - "Tăng, giảm các khoản phải thu"
              - "Tăng, giảm hàng tồn kho"
              - "Tăng, giảm các khoản phải trả (Không kể lãi vay phải trả, thuế thu nhập doanh nghiệp phải nộp)"
              - "Tăng giảm chi phí trả trước"
              - "Tăng giảm tài sản ngắn hạn khác"
              - "Tiền lãi vay phải trả"
              - "Thuế thu nhập doanh nghiệp đã nộp"
              - "Tiền thu khác từ hoạt động kinh doanh"
              - "Tiền chi khác từ hoạt động kinh doanh"
              - "Lưu chuyển tiền thuần từ hoạt động kinh doanh"
              - "1. Tiền chi để mua sắm, xây dựng tài sản cố định và các tài sản dài hạn khác"
              - "2. Tiền thu từ thanh lý, nhượng bán tài sản cố định và các tài sản dài hạn khác"
              - "3. Tiền chi cho vay, mua các công cụ nợ của đơn vị khác"
              - "4. Tiền thu hồi cho vay, bán lại các công cụ nợ của các đơn vị khác"
              - "5. Đầu tư góp vốn vào công ty liên doanh liên kết"
              - "6. Chi đầu tư ngắn hạn"
              - "7. Tiền chi đầu tư góp vốn vào đơn vị khác"
              - "8. Tiền thu hồi đầu tư góp vốn vào đơn vị khác"
              - "9. Lãi tiền gửi đã thu"
              - "10. Tiền thu lãi cho vay, cổ tức và lợi nhuận được chia"
              - "11. Tiền chi mua lại phần vốn góp của các cổ đông thiểu số"
              - "Lưu chuyển tiền thuần từ hoạt động đầu tư"
              - "1. Tiền thu từ phát hành cổ phiếu, nhận vốn góp của chủ sở hữu"
              - "2. Tiền chi trả vốn góp cho các chủ sở hữu, mua lại cổ phiếu của doanh nghiệp đã phát hành"
              - "3. Tiền vay ngắn hạn, dài hạn nhận được"
              - "4. Tiền chi trả nợ gốc vay"
              - "5. Tiền chi trả nợ thuê tài chính"
              - "6. Tiền chi khác từ hoạt động tài chính"
              - "7. Tiền chi trả từ cổ phần hóa"
              - "8. Cổ tức, lợi nhuận đã trả cho chủ sở hữu"
              - "9. Vốn góp của các cổ đông thiểu số vào các công ty con"
              - "10. Chi tiêu quỹ phúc lợi xã hội"
              - "Lưu chuyển tiền thuần từ hoạt động tài chính"
              - "Lưu chuyển tiền thuần trong kỳ"
              - "Tiền và tương đương tiền đầu kỳ"
              - "Ảnh hưởng của thay đổi tỷ giá hối đoái quy đổi ngoại tệ"
              - "Tiền và tương đương tiền cuối kỳ"
            new_column: chunk_content
        - kind: etl_pipeline.infrastructure.polars.etl.transform.columns.SelectColumns
          spec:
            columns:
              - id
              - tên cổ phiếu
              - năm
              - quý
              - chunk_content
        - kind: etl_pipeline.infrastructure.polars.etl.transform.columns.RenameColumns
          spec:
            column_mappings: 
              tên cổ phiếu: stock_id
              năm: year
              quý: quarter
        - kind: etl_pipeline.infrastructure.polars.etl.transform.columns.AddColumn
          spec:
            column: is_embedded
            value: 0
        - kind: etl_pipeline.infrastructure.polars.etl.transform.columns.AddColumn
          spec:
            column: document_type
            value: "cash_flow_statement"
  loader:
    kind: QdrantLoaderConfig
    spec:
      qdrant_url: http://qdrant:6333
      destination_collection_name: stock_price_embedded