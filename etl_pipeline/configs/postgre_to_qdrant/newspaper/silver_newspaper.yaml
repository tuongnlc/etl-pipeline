---
kind: QdrantToQdrantSilverConfig
spec:
  extractor:
    kind: QdrantExtractorWithPayloadConfig
    spec:
      qrant_url: http://qdrant:6333
      collection_name: newspaper
      payload_filter: 
        is_embedded: 0
  transform:
    kind: QdrantTransformConfig
    spec:
      transform_steps:
        - kind: etl_pipeline.infrastructure.polars.etl.transform.example.ExampleTransformStep
        - kind: etl_pipeline.infrastructure.polars.etl.transform.columns.SelectColumns
          spec:
            columns:
              - id
              - publish_date
              - newspaper_content
        - kind: etl_pipeline.infrastructure.polars.etl.transform.clean_text.CleanTextPolars
          spec:
            col_name: newspaper_content
        - kind: etl_pipeline.infrastructure.polars.etl.transform.chunking.ChunkPolars
          spec:
            document_col_name: newspaper_content
            chunk_col_name: chunk_content
            splitter_type: recursive_character
            chunk_size: 1200
            chunk_overlap: 300
        - kind: etl_pipeline.infrastructure.polars.etl.transform.embedding.TextEmbedding
          spec:
            embedding_type: google_embedding
            model: gemini-embedding-2
            task_type_documents: RETRIEVAL_DOCUMENT
            task_type_query: RETRIEVAL_QUERY
            output_dimensionality: 768
            batch_size: 100
            text_column: chunk_content
            output_column: chunk_embedded
            number_of_small_dataframes: 3
  loader:
    kind: QdrantLoaderConfig
    spec:
      qrant_url: http://qdrant:6333
      destination_collection_name: newspaper_embedded
      qrant_payload: 
        id: str
        document_id: str
        publish_date: Optional[date]
        chunk_content: str
        chunk_index: int
      is_upsert_source_table: true
      source_name: newspaper
      qrant_payload_for_source_table:
        is_embedded: 1
      payload_filter_for_source_table:
        is_embedded: 0
