---
kind: PostgreToDatabricksVolumeBronzeConfig
spec:
  extractor:
    kind: PostgreDBExtractorWithPolarsConfig
    spec:
      uri: postgresql://postgres:postgres@localhost:5432/market_data
      source_table_name: public.fs_income_statement_type_four
      enable_execution_date: false
  loader:
    kind: DatabricksVolumeLoaderConfig
    spec:
      volume_url: finance_data_volume.finance_data.fs_income_statement_type_four
      local_file_path: tmp/fs_income_statement_type_four.parquet
  
