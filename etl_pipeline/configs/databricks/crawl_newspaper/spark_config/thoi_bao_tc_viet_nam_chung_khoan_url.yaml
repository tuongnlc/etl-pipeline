---
kind: CrawlNewspaperUrlJobConfig
spec:
  crawler:
    kind: CrawlNewspaperUrlCrawlerConfig
    spec:
      link: https://thoibaotaichinhvietnam.vn/chung-khoan
  transform:
    kind: SparkTransformConfig
    spec:
      transform_steps:
        - kind: etl_pipeline.infrastructure.spark.etl.transform.deduplicated.DeduplicatedRows
          spec:
            deduplicate_columns:
              - url
        - kind: etl_pipeline.infrastructure.spark.etl.transform.columns.AddDateColumn
          spec:
            column_name: created_date
            value: "{{ datetime.now().date() }}"
  loader:
    kind: DeltaMergeLoaderWithSparkConfig
    spec:
      catalog: market_news_datalake
      schema: newspaper
      table: newspaper_url
      merge_keys:
        - url
