---
kind: PostgreToDatabricksVolumeBronzeConfig
spec:
  extractor:
    kind: PostgreDBExtractorWithPolarsConfig
    spec:
      uri: postgresql://postgres:postgres@localhost:5432/market_data
      source_table_name: public.company_name
      enable_execution_date: false
  loader:
    kind: DatabricksVolumeLoaderConfig
    spec:
      volume_url: finance_data_volume.finance_data.company_name
      local_file_path: tmp/company_name.parquet
