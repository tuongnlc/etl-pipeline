---
kind: PostgreToBqSilverConfig
spec:
  extractor: "PostgreDBExtractorWithPolars"
    query: 
      SELECT id::text AS id,
        fund_id,
        stock_id,
        business_sector,
        gav,
        month
      FROM public.fund_gav
    uri: "postgresql://postgres:postgres@localhost:5432/postgres" #Update here
  loader: "BigQueryLoaderPolars"
    gcp_credential_key: "gcp_sa_for_bq_data_append"
    project: "rich-finance-2026"
    dataset: "market_data"
    table: "fund_gav"
  
