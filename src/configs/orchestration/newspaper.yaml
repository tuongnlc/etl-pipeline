---
kind: DagDefinition
metadata:
  name: newspaper
spec:
  dag_id: newspaper
  schedule: "0 0 * * *"
  start_date: 2023-01-01
  catchup: False
  default_args:
    owner: tuongnguyen
    retries: 5
    on_failure_callback: []
  tags: ["newspaper"]
  task_factories:
    - id: job
      factory_type: BronzeNewspaperTaskFactory
      args:
        task_id: "newspaper"
        job_config_path: /opt/airflow/dags/etl_pipeline_dags/src/config/postgre_to_qdrant/newspaper/bronze_newspaper.yaml
       
