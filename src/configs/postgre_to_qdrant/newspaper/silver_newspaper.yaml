---
kind: QdrantToQdrantSilverConfig
spec:
  loader:
    kind: QdrantExtractorWithPayloadConfig
    spec:
      qrant_url: localhost:6333
      collection_name: newspaper
      payload_filter: 
        is_load_to_qdrant: 0
  transformer:
    kind: QdrantTransformConfig
    spec:
      transform_steps:
        - kind: ExampleTransformStep
        - kind: CleanTextPolars
  extractor:
    kind: QdrantExtractorWithPayloadConfig
    spec:
      qrant_url: http://qdrant:6333
      collection_name: newspaper
      payload_filter:
        is_load_to_qdrant: 0